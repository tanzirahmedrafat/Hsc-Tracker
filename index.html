    <script>
      // Suppress benign Vite HMR WebSocket disconnect errors per environment guidelines
      (function() {
        function isViteHmrError(err) {
          if (!err) return false;
          const text = (typeof err === 'string' ? err : (err.message || '') + ' ' + (err.stack || '') + ' ' + String(err)).toLowerCase();
          return text.includes('websocket') || text.includes('vite') || text.includes('closed without opened');
        }

        const origError = console.error;
        console.error = function(...args) {
          for (let i = 0; i < args.length; i++) {
            if (isViteHmrError(args[i])) return;
          }
          origError.apply(console, args);
        };

        const origWarn = console.warn;
        console.warn = function(...args) {
          for (let i = 0; i < args.length; i++) {
            if (isViteHmrError(args[i])) return;
          }
          origWarn.apply(console, args);
        };

        window.addEventListener('error', function(event) {
          if (isViteHmrError(event.error) || isViteHmrError(event.message) || (event.filename && event.filename.includes('@vite/client'))) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (isViteHmrError(event.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
